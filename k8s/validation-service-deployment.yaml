apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: validation-service
  name: validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: validation-service
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.network/bookmark-network: "true"
        io.kompose.service: validation-service
    spec:
      containers:
      - env:
        - name: BOOKMARK_SERVICE_HOST
          value: bookmark-service
        - name: BOOKMARK_SERVICE_PORT
          value: "8000"
        - name: BOOKMARK_SERVICE_TIMEOUT_SECONDS
          value: "10"
        - name: DEBUG
          value: "false"
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_SCHEDULER
          value: "true"
        - name: HOST
          value: 0.0.0.0
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: 172.19.0.3:9092
        - name: KAFKA_CONSUMER_GROUP
          value: validation-service
        - name: KAFKA_TOPIC
          value: bookmarks.bookmark.created
        - name: KAFKA_VALIDATION_TOPIC
          value: bookmarks.validation.completed
        - name: PORT
          value: "8002"
        - name: REVALIDATION_BATCH_SIZE
          value: "100"
        - name: REVALIDATION_INTERVAL_HOURS
          value: "24"
        - name: VALIDATION_MAX_ATTEMPTS
          value: "3"
        - name: VALIDATION_TIMEOUT_SECONDS
          value: "10"
        image: validation-service
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8002/health')
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 10
        name: bookmark-validation
        ports:
        - containerPort: 8002
        resources: {}
      restartPolicy: Always

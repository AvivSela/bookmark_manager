apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: validation
  name: validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation
  strategy: {}
  template:
    metadata:
      labels:
        app: validation
    spec:
      containers:
      - env:
        - name: PORT
          value: "8002"
        - name: HOST
          value: "0.0.0.0"
        - name: APP_NAME
          value: "Bookmark Validation Service"
        - name: KAFKA_CONSUMER_GROUP
          value: "validation-service"
        - name: ENABLE_SCHEDULER
          value: "true"
        - name: REVALIDATION_BATCH_SIZE
          value: "100"
        - name: REVALIDATION_INTERVAL_HOURS
          value: "24"
        - name: VALIDATION_MAX_ATTEMPTS
          value: "3"
        - name: VALIDATION_TIMEOUT_SECONDS
          value: "10"
        envFrom:
        - configMapRef:
            name: external-services-config
        image: validation-service
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8002/health')
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 10
        name: bookmark-validation
        ports:
        - containerPort: 8002
        resources: {}
      restartPolicy: Always

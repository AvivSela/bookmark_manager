apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: enrichment-service
  name: enrichment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: enrichment-service
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.network/bookmark-network: "true"
        io.kompose.service: enrichment-service
    spec:
      containers:
      - env:
        - name: BOOKMARK_SERVICE_HOST
          value: bookmark-service
        - name: BOOKMARK_SERVICE_PORT
          value: "80"
        - name: DEBUG
          value: "false"
        - name: ENABLE_METRICS
          value: "true"
        - name: HOST
          value: 0.0.0.0
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: 172.19.0.3:9092
        - name: KAFKA_TOPIC
          value: bookmarks.bookmark.created
        - name: PORT
          value: "8001"
        - name: POSTGRES_DB
          value: bookmark_db
        - name: POSTGRES_HOST
          value: 172.19.0.4
        - name: POSTGRES_PASSWORD
          value: bookmark_pass
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: bookmark_user
        image: enrichment-service
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8001/health')
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 10
        name: bookmark-enrichment
        ports:
        - containerPort: 8001
        resources: {}
      restartPolicy: Always

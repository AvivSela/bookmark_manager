apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: enrichment
  name: enrichment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrichment
  strategy: {}
  template:
    metadata:
      labels:
        app: enrichment
    spec:
      containers:
      - env:
        - name: PORT
          value: "8001"
        - name: HOST
          value: "0.0.0.0"
        - name: APP_NAME
          value: "Bookmark Enrichment Service"
        - name: KAFKA_CONSUMER_GROUP
          value: "enrichment-service"
        envFrom:
        - secretRef:
            name: postgres-credentials
        - configMapRef:
            name: external-services-config
        image: enrichment-service
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8001/health')
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 10
        name: bookmark-enrichment
        ports:
        - containerPort: 8001
        resources: {}
      restartPolicy: Always

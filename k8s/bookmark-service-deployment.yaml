apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bookmark
  name: bookmark-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookmark
  strategy: {}
  template:
    metadata:
      labels:
        app: bookmark
    spec:
      containers:
      - env:
        - name: PORT
          value: "8000"
        - name: APP_NAME
          value: "Bookmark API"
        envFrom:
        - secretRef:
            name: postgres-credentials
        - configMapRef:
            name: external-services-config
        image: bookmark-service:latest
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 10
        name: bookmark-service
        ports:
        - containerPort: 8000
        resources: {}
      restartPolicy: Always

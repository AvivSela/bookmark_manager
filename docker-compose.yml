services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmark_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bookmark_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookmark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmark_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: bookmark-kafka
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bookmark-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bookmark-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: bookmark-kafdrop
    environment:
      KAFKA_BROKERCONNECT: bookmark-kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    ports:
      - "${KAFDROP_PORT:-9000}:9000"
    networks:
      - bookmark-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bookmark-pgadmin
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/pgpass
    networks:
      - bookmark-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bookmark-service:
    build:
      context: ./services/bookmark_service
      dockerfile: Dockerfile
    container_name: bookmark-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmark_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bookmark_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: ${DEBUG:-false}
      KAFKA_BOOTSTRAP_SERVERS: bookmark-kafka:9092
      KAFKA_TOPIC_PREFIX: bookmarks
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-gzip}
      KAFKA_MAX_RETRIES: ${KAFKA_MAX_RETRIES:-3}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-30000}
    ports:
      - "${BOOKMARK_SERVICE_PORT:-8000}:8000"
    networks:
      - bookmark-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  enrichment-service:
    build:
      context: ./services/enrichment_service
      dockerfile: Dockerfile
    container_name: bookmark-enrichment
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmark_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bookmark_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: bookmark-kafka:9092
      KAFKA_TOPIC: bookmarks.bookmark.created
      DEBUG: ${DEBUG:-false}
      HOST: "0.0.0.0"
      PORT: "8001"
    ports:
      - "${ENRICHMENT_SERVICE_PORT:-8001}:8001"
    networks:
      - bookmark-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bookmark-network:
    driver: bridge

apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    version: 1

  # Loki datasource
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Request ID correlation - link to logs with same request_id
        - datasourceUid: loki
          matcherRegex: '"request_id":"([^"]+)"'
          name: "View Request Logs"
          url: '/explore?left={"datasource":"Loki","queries":[{"expr":"{service=~\\".+\\"} | json | request_id=\\"$${__value.raw}\\"","refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
        # Bookmark ID correlation - link to logs for this bookmark
        - datasourceUid: loki
          matcherRegex: '"bookmark_id":"([^"]+)"'
          name: "View Bookmark Logs"
          url: '/explore?left={"datasource":"Loki","queries":[{"expr":"{service=~\\".+\\"} | json | bookmark_id=\\"$${__value.raw}\\"","refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
        # Tenant ID correlation
        - datasourceUid: loki
          matcherRegex: '"tenant_id":"([^"]+)"'
          name: "View Tenant Logs"
          url: '/explore?left={"datasource":"Loki","queries":[{"expr":"{service=~\\".+\\"} | json | tenant_id=\\"$${__value.raw}\\"","refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
    version: 1

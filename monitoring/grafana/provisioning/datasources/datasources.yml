apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    version: 1

  # Loki datasource
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Allow clicking on request_id in logs to query related logs
        - datasourceUid: loki
          matcherRegex: '"request_id":"([^"]+)"'
          name: request_id
          url: $${__value.raw}
        # Allow clicking on bookmark_id in logs to query related logs
        - datasourceUid: loki
          matcherRegex: '"bookmark_id":"([^"]+)"'
          name: bookmark_id
          url: $${__value.raw}
    version: 1

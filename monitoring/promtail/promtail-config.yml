server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from Docker containers (including Kind node)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    # Pipeline to parse logs
    pipeline_stages:
      # Try to parse as JSON first
      - match:
          selector: '{job="docker-containers"}'
          stages:
            - json:
                expressions:
                  timestamp: timestamp
                  level: level
                  service: service
                  logger: logger
                  message: message
                  request_id: request_id
                  tenant_id: tenant_id
                  bookmark_id: bookmark_id
            - labels:
                level:
                service:
                logger:
            - timestamp:
                source: timestamp
                format: RFC3339
            - output:
                source: message

    # Relabel to filter and add metadata
    relabel_configs:
      # Keep only containers with specific names
      - source_labels: [__meta_docker_container_name]
        regex: '.*(bookmark|enrichment|validation).*'
        action: keep

      # Add container name as label
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: '/(.*)'
        replacement: '$1'

      # Add pod label from container labels
      - source_labels: [__meta_docker_container_label_io_kubernetes_pod_name]
        target_label: pod

      # Add namespace from container labels
      - source_labels: [__meta_docker_container_label_io_kubernetes_pod_namespace]
        target_label: namespace
